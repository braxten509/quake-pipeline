# Pulls new USGS earthquakes into Snowflake every 15 minutes.
# GitHub may start scheduled runs a few minutes late when it is busy.
name: Ingest live quakes

on:
  schedule:
    - cron: "7,22,37,52 * * * *" # every 15 min, off the busy :00 mark
  workflow_dispatch: # "Run workflow" button for manual runs

concurrency:
  group: ingest # never run two at once
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Pull and merge new quakes
        run: python -W ignore::FutureWarning scripts/ingest_live.py
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
          SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
