# Manual-only copy of the live job ("Run workflow" button on GitHub).
# The real 15-minute schedule is a systemd timer on my PC: see deploy/.
# GitHub's own schedule never fired on this new repo, so it was turned off.
name: Ingest live quakes

on:
  workflow_dispatch: # "Run workflow" button for manual runs

concurrency:
  group: ingest # never run two at once
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Pull and merge new quakes
        run: python -W ignore::FutureWarning scripts/ingest_live.py
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
          SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
